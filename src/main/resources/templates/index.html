<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System - Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div class="selection-container">
        <div class="selection-header">
            <h1>Employee Management System</h1>
            <p>Please select your role to continue</p>
        </div>

        <div class="selection-cards">
            <div class="selection-card admin-card">
                <div class="card-icon">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                        <path d="M2 17l10 5 10-5M2 12l10 5 10-5"></path>
                    </svg>
                </div>
                <h2>Admin Login</h2>
                <p>Access administrative dashboard and manage employees</p>
                <a href="/admin/login" class="btn-card admin-btn">Continue as Admin</a>
            </div>

            <div class="selection-card employee-card">
                <div class="card-icon">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <h2>Employee Login</h2>
                <p>Access your dashboard and manage leave requests</p>
                <a href="/employee/login" class="btn-card employee-btn">Continue as Employee</a>
            </div>
        </div>
    </div>
</body>

</html>
